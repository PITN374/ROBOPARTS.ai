[build-system] requires = ["setuptools>=69.0", "wheel"] build-backend = "setuptools.build_meta"

[project] name = "roboagentic" version = "0.1.0" description = "ROBOAGENTIC: Robotics supplier intelligence, manufacturer discovery, RFQ preparation, and reporting for ROBOPARTS.ai" readme = "README.md" requires-python = ">=3.12" license = "MIT" authors = [ { name = "ROBOPARTS.ai" } ] keywords = [ "robotics", "humanoid-robots", "supplier-discovery", "procurement", "RFQ", "automation", "multilingual" ] dependencies = [ "pydantic>=2.8,<3.0", "httpx>=0.27,<1.0", "beautifulsoup4>=4.12,<5.0", "SQLAlchemy>=2.0,<3.0", "python-dotenv>=1.0,<2.0", "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0" ]

[project.optional-dependencies] dev = [ "pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.6,<1.0" ] postgres = [ "psycopg[binary]>=3.2,<4.0" ]

[project.scripts] roboagentic = "roboagentic.main:main"

[tool.setuptools.packages.find] where = ["src"]

[tool.pytest.ini_options] testpaths = ["tests"] pythonpath = ["src"] asyncio_mode = "auto"

[tool.ruff] line-length = 88 target-version = "py312"
